# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: flood-prediction-india-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      # Optional: restrict browser access, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        value: "*"
